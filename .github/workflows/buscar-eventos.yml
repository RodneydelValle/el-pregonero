name: Buscar eventos

on:
  schedule:
    # Todos los días a las 06:00 hora de Chile. GitHub usa hora UTC y Chile cambia de horario,
    # así que hay dos horarios y el paso "¿Son las 6 en Chile?" deja seguir solo al que corresponde.
    - cron: "0 9 * * *"    # 06:00 en horario de verano (UTC-3)
    - cron: "0 10 * * *"   # 06:00 en horario de invierno (UTC-4)
  workflow_dispatch:         # botón "Run workflow" para buscar cuando quieras
  push:
    branches: [main]         # cualquier cambio en la web o en los gustos se publica al tiro

permissions:
  contents: write   # guardar data/eventos.json
  pages: write
  id-token: write

concurrency:
  group: pregonero
  cancel-in-progress: false

jobs:
  buscar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      seguir: ${{ steps.hora.outputs.seguir }}
    steps:
      - name: ¿Son las 6 en Chile?
        id: hora
        run: |
          desfase=$(TZ=America/Santiago date +%z)
          caso="${{ github.event_name }}|${{ github.event.schedule }}|$desfase"
          case "$caso" in
            "schedule|0 9 * * *|-0300"|"schedule|0 10 * * *|-0400") seguir=true ;;
            schedule*) seguir=false ;;
            *) seguir=true ;;
          esac
          echo "Chile está en UTC$desfase · $caso → seguir=$seguir"
          echo "seguir=$seguir" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.hora.outputs.seguir == 'true'
      - uses: actions/setup-python@v5
        if: steps.hora.outputs.seguir == 'true'
        with:
          python-version: "3.12"
      - name: Preparar
        if: steps.hora.outputs.seguir == 'true'
        run: pip install --quiet pillow tzdata
      - name: Buscar eventos
        if: steps.hora.outputs.seguir == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # IA gratis de Google AI Studio (lee páginas y afiches)
        run: python scripts/actualizar.py
      - name: Guardar resultados
        if: steps.hora.outputs.seguir == 'true'
        run: |
          git config user.name "el-pregonero[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en la agenda"
          else
            git commit -m "Pregón del $(TZ=America/Santiago date +%F)"
            git pull --rebase
            git push
          fi

  publicar:
    needs: buscar
    if: always() && (needs.buscar.result == 'success' || needs.buscar.result == 'skipped') && needs.buscar.outputs.seguir != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
