name: Buscar eventos

on:
  schedule:
    - cron: "15 10 * * *"   # todos los días 07:15 en Chile (horario de verano; 06:15 en invierno)
  workflow_dispatch:         # botón "Run workflow" para buscar cuando quieras
  push:
    branches: [main]         # cualquier cambio en la web o en los gustos se publica al tiro

permissions:
  contents: write   # guardar data/eventos.json
  models: read      # IA gratuita de GitHub Models (lee texto y afiches)
  pages: write
  id-token: write

concurrency:
  group: pregonero
  cancel-in-progress: false

jobs:
  buscar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar
        run: pip install --quiet pillow tzdata
      - name: Buscar eventos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/actualizar.py
      - name: Guardar resultados
        run: |
          git config user.name "el-pregonero[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en la agenda"
          else
            git commit -m "Pregón del $(TZ=America/Santiago date +%F)"
            git pull --rebase
            git push
          fi

  publicar:
    needs: buscar
    if: always() && (needs.buscar.result == 'success' || needs.buscar.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
