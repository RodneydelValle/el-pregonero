name: Buscar eventos

on:
  schedule:
    # Cada hora, al minuto 17 (a la hora en punto GitHub se atrasa más). El script decide qué búsqueda toca:
    # la completa cada "horas_entre_completas" (config/gustos.json) y, entre medio, la rápida
    # (solo ticketeras y agendas, que es donde aparecen primero los eventos nuevos).
    - cron: "17 * * * *"
  workflow_dispatch:         # botón "Run workflow" para buscar cuando quieras (siempre hace la completa)
    inputs:
      solo_publicar:
        description: "Solo publicar la web, sin buscar (no gasta IA)"
        type: boolean
        default: false
      solo_imagenes:
        description: "Solo rellenar las imágenes que les faltan a los eventos (sin IA ni búsqueda)"
        type: boolean
        default: false
  push:
    branches: [main]         # cualquier cambio en la web o en los gustos se publica al tiro

permissions:
  contents: write   # guardar data/eventos.json
  pages: write
  id-token: write

concurrency:
  group: pregonero
  cancel-in-progress: false

jobs:
  buscar:
    if: github.event_name != 'push' && !inputs.solo_publicar
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar
        run: pip install --quiet pillow tzdata
      - name: Buscar eventos
        if: ${{ !inputs.solo_imagenes }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # IA gratis de Google AI Studio (lee páginas y afiches)
          MODO: ${{ github.event_name == 'schedule' && 'auto' || 'completa' }}
        run: python scripts/actualizar.py --modo "$MODO"
      - name: Rellenar imágenes
        # Relleno a pedido: abre hasta 150 páginas (la búsqueda normal ya busca unas 30 por vuelta)
        if: ${{ inputs.solo_imagenes }}
        run: python scripts/actualizar.py --solo-imagenes 150
      - name: Guardar resultados
        run: |
          git config user.name "el-pregonero[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en la agenda"
            exit 0
          fi
          git commit -m "Pregón del $(TZ=America/Santiago date '+%F %H:%M')"
          for intento in 1 2 3; do
            if ! git pull --rebase; then
              # Alguien agregó eventos a mano mientras el robot buscaba: se respeta lo de la persona,
              # esta vuelta no se guarda y la próxima (en una hora) vuelve a encontrar lo mismo.
              git rebase --abort
              echo "::warning::La agenda cambió mientras buscaba; esta vuelta no se guarda y la próxima la repite."
              exit 0
            fi
            git push && exit 0
            sleep 10
          done
          echo "::error::No se pudo guardar la agenda"
          exit 1

  publicar:
    needs: buscar
    if: always() && (needs.buscar.result == 'success' || needs.buscar.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
